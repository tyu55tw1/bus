<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5fb3">
<meta name="referrer" content="no-referrer">
<title>公車</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- 公車手機版（2026-11-27 起）：程式放 GitHub Pages（公開），TDX 金鑰、常用站牌、家／公司只存在手機（localStorage） -->
<div id="app">
  <header class="top">
    <h1 id="ttl">公車</h1>
    <span id="beta" class="tag" hidden>測試版</span>
  </header>
  <main id="main">
    <section id="pane-fav" class="pane"><div id="trip-box"></div><div id="ai-box"></div><div id="fav-list"></div><div id="remind-box"></div></section>
    <section id="pane-near" class="pane"></section>
    <section id="pane-route" class="pane"></section>
    <section id="pane-rail" class="pane"></section>
    <section id="pane-set" class="pane"></section>
  </main>
  <nav class="tabs">
    <button data-tab="fav" class="on">⭐ 常用</button>
    <button data-tab="near">📍 附近</button>
    <button data-tab="route">🔍 路線</button>
    <button data-tab="rail">🚆 火車</button>
    <button data-tab="set">⚙️ 設定</button>
  </nav>
</div>
<div id="toast" class="toast" hidden></div>
<script src="rail.js"></script>
<script src="trip.js"></script>
<script src="ai.js"></script>
<script src="remind.js"></script>
<script src="app.js"></script>
</body>
</html>
